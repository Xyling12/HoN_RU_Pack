name: Build and Release Installer

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Installer (Powershell)
        run: |
          .\build\build_hon_ru_installer_exe.ps1 -PackageRoot .
        shell: powershell

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            dist/HoN_RU_Pack_Installer.exe
            dist/installer_payload.zip

      - name: Update Latest Release
        uses: ncipollo/release-action@v1
        with:
          name: "Latest Auto-Build"
          tag: "latest"
          body: "Автоматическая сборка русификатора из ветки master."
          artifacts: "dist/HoN_RU_Pack_Installer.exe"
          allowUpdates: true
          makeLatest: true
          prerelease: false
